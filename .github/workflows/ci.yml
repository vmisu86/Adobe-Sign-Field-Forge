name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Design tokens (no literal colours outside src/styles)
        run: npm run check:tokens

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      # Karma + Jasmine in headless Chrome (the runner ships with Chrome).
      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build
