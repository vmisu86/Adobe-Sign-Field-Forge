@if (fieldsOnCurrentPage().length > 0) {
  <section class="ff-section">
    <h3 class="ff-section__label">Fields on Page {{ pdf.currentPage() }}</h3>
    <div class="ff-stack">
      @for (field of fieldsOnCurrentPage(); track field.id) {
        <button
          type="button"
          class="ff-option ff-option--compact ff-kind-{{ fieldTypeService.getFieldKind(field) }}"
          [class.is-selected]="state.selectedFieldId() === field.id"
          [attr.aria-pressed]="state.selectedFieldId() === field.id"
          (click)="editor.select(field.id)"
        >
          <i class="ff-option__icon" nz-icon [nzType]="fieldTypeService.getFieldIcon(field)"></i>
          <span class="ff-option__label">{{ field.name }}</span>
          @if (field.required) {
            <span class="ff-chip ff-chip--danger">Required</span>
          }
        </button>
      }
    </div>
  </section>
}
