@if (fieldsOnCurrentPage().length > 0) {
  <div class="fields-list-container">
    <div class="group-label">Fields on Page {{ pdf.currentPage() }}</div>
    <nz-list [nzDataSource]="fieldsOnCurrentPage()" nzSize="small">
      @for (field of fieldsOnCurrentPage(); track field.id) {
        <nz-list-item
          [class.selected]="state.selectedFieldId() === field.id"
          (click)="editor.select(field.id)"
          (keydown.enter)="editor.select(field.id)"
          (keydown.space)="editor.select(field.id); $event.preventDefault()"
          role="button"
          tabindex="0"
          style="cursor: pointer"
        >
          <div class="field-list-item">
            <i
              nz-icon
              [nzType]="fieldTypeService.getFieldIcon(field)"
              [style.color]="fieldTypeService.getFieldColor(field)"
            ></i>
            <span class="field-name">{{ field.name }}</span>
            @if (field.required) {
              <nz-tag nzColor="error">Required</nz-tag>
            }
          </div>
        </nz-list-item>
      }
    </nz-list>
  </div>
}
