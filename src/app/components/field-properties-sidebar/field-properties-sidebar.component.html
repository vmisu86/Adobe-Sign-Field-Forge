<aside class="ff-panel ff-panel--right" aria-label="Inspector">
  <div class="ff-panel__header">
    <h2 class="ff-panel__title">Inspector</h2>
  </div>

  <div class="ff-panel__body">
    @if (state.selectedField(); as field) {
      <section class="ff-section">
        <h3 class="ff-section__label">Properties</h3>
        <app-field-property-form
          [field]="field"
          (fieldUpdated)="editor.updateSelected($event)"
          (deleteClicked)="editor.deleteSelected()"
        >
        </app-field-property-form>
      </section>
    }

    <app-field-list></app-field-list>
  </div>
</aside>
