<div class="sidebar-content">
  <div class="sidebar-header">
    <h3>Properties</h3>
  </div>

  @if (state.selectedField(); as field) {
    <!-- Selected Field Properties -->
    <div class="properties-panel">
      <app-field-property-form
        [field]="field"
        (fieldUpdated)="editor.updateSelected($event)"
        (deleteClicked)="editor.deleteSelected()"
      >
      </app-field-property-form>
    </div>
  } @else {
    <!-- No Selection State -->
    <div class="no-selection">
      <nz-empty nzNotFoundContent="No field selected" [nzNotFoundImage]="'simple'"></nz-empty>
    </div>
  }
</div>
