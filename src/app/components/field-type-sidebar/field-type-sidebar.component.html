<aside class="ff-panel ff-panel--left" aria-label="Tools">
  <div class="ff-panel__header">
    <h2 class="ff-panel__title">Tools</h2>
  </div>

  <div class="ff-panel__body">
    <section class="ff-section">
      <div class="ff-stack">
        <button
          type="button"
          class="ff-option ff-option--compact"
          [class.is-selected]="!state.armed()"
          [attr.aria-pressed]="!state.armed()"
          (click)="selectTool()"
        >
          <i class="ff-option__icon" nz-icon nzType="select"></i>
          <span class="ff-option__label">Select</span>
          <kbd class="ff-option__shortcut">V</kbd>
        </button>
      </div>
    </section>

    @for (group of groups; track group.label) {
      <section class="ff-section">
        <h3 class="ff-section__label">{{ group.label }}</h3>
        <div class="ff-stack">
          @for (preset of group.items; track fieldTypeService.keyOf(preset)) {
            <button
              type="button"
              class="ff-option ff-option--compact ff-kind-{{ preset.kind }}"
              [class.is-selected]="isSelected(preset)"
              [attr.aria-pressed]="isSelected(preset)"
              [attr.aria-keyshortcuts]="preset.shortcut"
              (click)="selectFieldType(preset)"
            >
              <i class="ff-option__icon" nz-icon [nzType]="preset.icon"></i>
              <span class="ff-option__label">{{ preset.label }}</span>
              @if (preset.shortcut) {
                <kbd class="ff-option__shortcut">{{ preset.shortcut }}</kbd>
              }
            </button>
          }
        </div>
      </section>
    }
  </div>
</aside>
