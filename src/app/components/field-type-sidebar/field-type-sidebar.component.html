<aside class="ff-panel ff-panel--left" aria-label="Field types">
  <div class="ff-panel__header">
    <h2 class="ff-panel__title">Field Types</h2>
  </div>

  <div class="ff-panel__tools">
    <nz-input-wrapper>
      <input
        type="text"
        nz-input
        placeholder="Search field types..."
        aria-label="Search field types"
        [ngModel]="searchFieldType()"
        (ngModelChange)="searchFieldType.set($event)"
      />
      <i nz-icon nzType="search" nz-input-prefix></i>
    </nz-input-wrapper>
  </div>

  <div class="ff-panel__body">
    @for (group of filteredFieldTypeGroups(); track group.label) {
      <section class="ff-section">
        <h3 class="ff-section__label">{{ group.label }}</h3>
        <div class="ff-stack">
          @for (preset of group.items; track fieldTypeService.keyOf(preset)) {
            <button
              type="button"
              class="ff-option ff-kind-{{ preset.kind }}"
              [class.is-selected]="isSelected(preset)"
              [attr.aria-pressed]="isSelected(preset)"
              (click)="selectFieldType(preset)"
            >
              <i class="ff-option__icon" nz-icon [nzType]="preset.icon"></i>
              <span class="ff-option__label">{{ preset.label }}</span>
            </button>
          }
        </div>
      </section>
    }

    <app-field-list></app-field-list>
  </div>
</aside>
