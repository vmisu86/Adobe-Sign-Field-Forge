<nz-layout class="app-layout">
  <!-- Top Header/Toolbar -->
  <app-toolbar></app-toolbar>

  <!-- Field Type Indicator Banner -->
  @if (state.selectedType(); as selectedType) {
    <nz-alert
      nzType="info"
      nzBanner
      [nzMessage]="'✏️ Selected: ' + selectedType.label + ' - Click on empty canvas to draw, click on fields to select'"
      nzCloseable
      (nzOnClose)="state.selectedTypeKey.set('')"
    >
    </nz-alert>
  }

  <nz-layout>
    <!-- Left Sidebar - Field Types & List -->
    @if (!state.leftSidebarCollapsed()) {
      <nz-sider [nzWidth]="280" nzTheme="light" class="left-sidebar">
        <app-field-type-sidebar></app-field-type-sidebar>
      </nz-sider>
    }

    <!-- Main Content Area -->
    <nz-layout>
      <nz-content class="main-content">
        @if (pdf.document()) {
          <!-- PDF Canvas -->
          <div class="pdf-canvas-container">
            <canvas #pdfCanvas class="pdf-canvas"></canvas>
            <canvas
              #drawingCanvas
              class="drawing-canvas"
              [class.drawing-mode]="state.selectedType()"
              [style.cursor]="state.cursor()"
              (mousedown)="onMouseDown($event)"
              (mousemove)="onMouseMove($event)"
            >
            </canvas>
          </div>
        } @else {
          <!-- Empty State when no PDF -->
          <div class="empty-state">
            <nz-empty [nzNotFoundImage]="'simple'" [nzNotFoundContent]="contentTpl">
              <ng-template #contentTpl>
                <h2>Welcome to FieldForge</h2>
                <p>Upload a PDF document to start adding form fields</p>
                <button nz-button nzType="primary" nzSize="large" (click)="actions.choosePdf()">
                  <i nz-icon nzType="upload"></i>
                  Upload PDF Document
                </button>
              </ng-template>
            </nz-empty>
          </div>
        }
      </nz-content>
    </nz-layout>

    <!-- Right Sidebar - Properties -->
    @if (!state.rightSidebarCollapsed()) {
      <nz-sider [nzWidth]="320" nzTheme="light" class="right-sidebar">
        <app-field-properties-sidebar></app-field-properties-sidebar>
      </nz-sider>
    }
  </nz-layout>
</nz-layout>
