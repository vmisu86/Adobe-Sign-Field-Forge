<header class="ff-toolbar">
  <div class="ff-toolbar__brand">
    <i nz-icon nzType="file-pdf"></i>
    <span>FieldForge</span>
  </div>

  <div class="ff-toolbar__group">
    <button
      nz-button
      (click)="toggleLeftSidebar()"
      nz-tooltip="Toggle Field Types Panel"
      aria-label="Toggle field types panel"
    >
      <i nz-icon [nzType]="state.leftSidebarCollapsed() ? 'menu-unfold' : 'menu-fold'"></i>
    </button>
  </div>

  <div class="ff-toolbar__divider"></div>

  <div class="ff-toolbar__group">
    <button nz-button nzType="primary" (click)="actions.choosePdf()">
      <i nz-icon nzType="upload"></i>
      Upload PDF
    </button>
    <button nz-button (click)="actions.importConfig()" nz-tooltip="Import Field Configuration">
      <i nz-icon nzType="download"></i>
      Import
    </button>
    <button nz-button (click)="actions.exportConfig()" nz-tooltip="Export Field Configuration">
      <i nz-icon nzType="upload"></i>
      Export
    </button>
    <button
      nz-button
      (click)="actions.exportAdobeFormFields()"
      nz-tooltip="Export the fields in the shape Adobe Sign takes as formFields"
    >
      <i nz-icon nzType="export"></i>
      Adobe JSON
    </button>
    <button nz-button (click)="actions.showJson()" nz-tooltip="View JSON Configuration">
      <i nz-icon nzType="code"></i>
      View JSON
    </button>
  </div>

  <div class="ff-toolbar__divider"></div>

  <div class="ff-toolbar__group">
    <button
      nz-button
      (click)="pdf.setPage(pdf.currentPage() - 1)"
      [disabled]="pdf.currentPage() <= 1"
      aria-label="Previous page"
    >
      <i nz-icon nzType="left"></i>
    </button>
    <span class="ff-toolbar__status" role="status">Page {{ pdf.currentPage() }} / {{ pdf.totalPages() }}</span>
    <button
      nz-button
      (click)="pdf.setPage(pdf.currentPage() + 1)"
      [disabled]="pdf.currentPage() >= pdf.totalPages()"
      aria-label="Next page"
    >
      <i nz-icon nzType="right"></i>
    </button>
  </div>

  <div class="ff-toolbar__divider"></div>

  <div class="ff-toolbar__group">
    <button
      nz-button
      [nzType]="state.showGrid() ? 'primary' : 'default'"
      (click)="toggleGrid()"
      nz-tooltip="Toggle Grid"
      aria-label="Toggle grid"
      [attr.aria-pressed]="state.showGrid()"
    >
      <i nz-icon nzType="table"></i>
    </button>
    <button
      nz-button
      [nzType]="state.snapToGrid() ? 'primary' : 'default'"
      (click)="toggleSnap()"
      nz-tooltip="Snap to Grid"
      aria-label="Snap to grid"
      [attr.aria-pressed]="state.snapToGrid()"
    >
      <i nz-icon nzType="block"></i>
    </button>
  </div>

  <div class="ff-toolbar__divider"></div>

  <div class="ff-toolbar__group">
    <button
      nz-button
      (click)="editor.undo()"
      [disabled]="!history.canUndo()"
      nz-tooltip="Undo (Ctrl+Z)"
      aria-label="Undo"
    >
      <i nz-icon nzType="undo"></i>
    </button>
    <button
      nz-button
      (click)="editor.redo()"
      [disabled]="!history.canRedo()"
      nz-tooltip="Redo (Ctrl+Shift+Z or Ctrl+Y)"
      aria-label="Redo"
    >
      <i nz-icon nzType="redo"></i>
    </button>
  </div>

  <div class="ff-toolbar__divider"></div>

  <div class="ff-toolbar__group">
    <nz-select
      #documentTypeModel="ngModel"
      [ngModel]="state.documentType()"
      (ngModelChange)="actions.requestDocumentType($event)"
      class="ff-toolbar__select"
      nz-tooltip="Coordinate System"
      aria-label="Coordinate system"
    >
      <nz-option [nzValue]="DocumentType.TRANSIENT" nzLabel="Transient"></nz-option>
      <nz-option [nzValue]="DocumentType.LIBRARY" nzLabel="Library"></nz-option>
    </nz-select>

    <button
      nz-button
      (click)="toggleRightSidebar()"
      nz-tooltip="Toggle Properties Panel"
      aria-label="Toggle properties panel"
    >
      <i nz-icon [nzType]="state.rightSidebarCollapsed() ? 'menu-fold' : 'menu-unfold'"></i>
    </button>
  </div>
</header>
